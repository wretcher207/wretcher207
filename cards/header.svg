<svg xmlns="http://www.w3.org/2000/svg" width="880" height="128" viewBox="0 0 880 128" role="img" aria-label="Dead Pixel Design. REAPER tools, an MCP server, plugins, sites and video from Houlton, Maine.">
<title>Dead Pixel Design. REAPER tools, an MCP server, plugins, sites and video from Houlton, Maine.</title>
<style>
  .sans { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
  .kicker { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; font-size: 11px; letter-spacing: 0.14em; fill: #8A8A85; }
  /* "backwards" hides elements only while the animation runs, so a renderer that
     skips animation still shows everything. */
  .rise { animation: rise 520ms cubic-bezier(.2,.7,.2,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none; } }
</style>
<rect x="0.5" y="0.5" width="879" height="127" fill="#0B0B0B" stroke="#2E2E2C"/>

<rect x="28" y="26" width="10" height="1.5" fill="#C9955A"/><text x="46" y="31" class="kicker">// WRETCHER207</text>
<text x="28" y="72" class="sans" font-size="30" font-weight="600" letter-spacing="-0.01em" fill="#F2F2EF">Dead Pixel Design</text>
<text x="28" y="100" class="sans" font-size="14" fill="#B4B4B0">REAPER tools, an MCP server, plugins, sites and video from Houlton, Maine.</text>
<text x="852" y="30" text-anchor="end" class="mono" font-size="11" fill="#8A8A85">deadpixeldesign.com</text>
<rect x="844" y="94" width="8" height="8" fill="#C9955A"><animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/></rect>
</svg>
